name: logement-yopougon-ajout

# Ajout depuis le téléphone : créer une issue contenant des liens d'annonces TikTok / Facebook
# et/ou des comptes d'agents (@nom ou lien de profil). Seul le propriétaire du dépôt peut ajouter (anti-spam).
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  ajout:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-aa2a7c7e-yoi443
      - name: Ajouter les liens et les comptes
        id: liens
        env:
          BODY: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
        run: |
          cd logement-yopougon/sources
          touch urls.txt comptes.txt
          n=0
          # liens d'annonces (vidéos TikTok, posts Facebook)
          for u in $(printf '%s\n' "$BODY" | grep -oE 'https?://[^ )>"]*(tiktok\.com/@[^/ ]+/(video|photo)/[0-9]+|vt\.tiktok\.com/[A-Za-z0-9]+|facebook\.com/[^ )>"]+|fb\.watch/[^ )>"]+)' | sort -u); do
            grep -qxF "$u" urls.txt || { echo "$u" >> urls.txt; n=$((n+1)); }
          done
          # comptes : @nom seul ou lien de profil TikTok (sans /video/)
          for a in $(printf '%s\n' "$BODY" | sed -E 's#https?://(www\.)?tiktok\.com/@[^/ ]+/(video|photo)/[0-9]+##g' | grep -oE '@[A-Za-z0-9._-]+' | sort -u); do
            grep -qxF "$a" comptes.txt || { echo "$a" >> comptes.txt; n=$((n+1)); }
          done
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Enregistrer
        if: steps.liens.outputs.n != '0'
        run: |
          git config user.name "logement-bot"
          git config user.email "logement-bot@users.noreply.github.com"
          git commit -am "Ajout de ${{ steps.liens.outputs.n }} lien(s)/compte(s) depuis l'issue #${{ github.event.issue.number }}"
          git push origin HEAD:ccr-aa2a7c7e-yoi443
      - name: Lancer la collecte
        if: steps.liens.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run logement-yopougon.yml --repo ${{ github.repository }} || echo "Collecte au prochain passage programmé"
      - name: Répondre et fermer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "${{ steps.liens.outputs.n }} lien(s) ou compte(s) ajouté(s). Ils seront traités par la prochaine collecte (lancée tout de suite si un lien a été ajouté)."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
