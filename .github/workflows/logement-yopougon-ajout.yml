name: logement-yopougon-ajout

# Ajout d'annonces depuis le téléphone : créer une issue contenant un ou plusieurs liens
# TikTok / Facebook. Seul le propriétaire du dépôt peut ajouter (anti-spam).
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  ajout:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-aa2a7c7e-yoi443
      - name: Ajouter les liens
        id: liens
        env:
          BODY: ${{ github.event.issue.title }} ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$BODY" | grep -oE 'https?://[^ )>"]*(tiktok\.com|facebook\.com|fb\.watch)[^ )>"]*' | sort -u > /tmp/liens.txt || true
          touch logement-yopougon/sources/urls.txt
          n=0
          while read -r u; do
            grep -qxF "$u" logement-yopougon/sources/urls.txt || { echo "$u" >> logement-yopougon/sources/urls.txt; n=$((n+1)); }
          done < /tmp/liens.txt
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Enregistrer
        if: steps.liens.outputs.n != '0'
        run: |
          git config user.name "logement-bot"
          git config user.email "logement-bot@users.noreply.github.com"
          git commit -am "Ajout de ${{ steps.liens.outputs.n }} lien(s) depuis l'issue #${{ github.event.issue.number }}"
          git push origin HEAD:ccr-aa2a7c7e-yoi443
      - name: Lancer la collecte
        if: steps.liens.outputs.n != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run logement-yopougon.yml --repo ${{ github.repository }} || echo "Collecte au prochain passage programmé"
      - name: Répondre et fermer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "${{ steps.liens.outputs.n }} lien(s) ajouté(s). Ils seront traités par la prochaine collecte (lancée tout de suite si un lien a été ajouté)."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
